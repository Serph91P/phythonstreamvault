name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Prevent concurrent test runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Backend Tests (Python)
  # ──────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run backend tests with coverage
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            --tb=short

      - name: Check migration orchestration
        run: >
          pytest -v --tb=short
          tests/test_migration_foundation.py
          tests/test_migration_service_orchestration.py

      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Archive coverage report
        if: always() && hashFiles('htmlcov/index.html') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage-report
          path: htmlcov/
          retention-days: 14

  # ──────────────────────────────────────────────
  # Frontend Build & Lint (Vue 3 + TypeScript)
  # ──────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci --prefer-offline

      - name: Check TypeScript/Vue code lint
        working-directory: app/frontend
        run: npm run lint:check

      - name: Lint design tokens (no hardcoded hex/breakpoints/transitions)
        working-directory: app/frontend
        run: npm run lint:tokens

      - name: Type check TypeScript code
        working-directory: app/frontend
        run: npm run type-check

      - name: Run frontend unit tests
        working-directory: app/frontend
        run: npm run test:unit

      - name: Build frontend (production)
        working-directory: app/frontend
        run: |
          rm -rf dist || true
          npm run build

      - name: Check deterministic frontend build output
        working-directory: app/frontend
        run: npm run test:build-output

      - name: Install Playwright Chromium
        working-directory: app/frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend browser tests
        working-directory: app/frontend
        run: npx playwright test

  # ──────────────────────────────────────────────
  # Python Lint & Type Check
  # ──────────────────────────────────────────────
  lint-and-typecheck:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint Python code
        run: ruff check app/

      - name: Check Python formatting
        run: ruff format --check app/

      - name: Type check Python code
        # The modernized surface is a bounded real gate. Legacy modules remain
        # outside this target until their SQLAlchemy typing migration lands.
        run: >
          mypy --follow-imports=skip --ignore-missing-imports
          app/config/settings.py app/core/exceptions.py
          app/middleware/logging.py app/observability.py app/routes/health.py

  # ──────────────────────────────────────────────
  # Integration Tests (Docker)
  # ──────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: streamvault:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: base,runtime

      - name: Test fresh PostgreSQL migrations, restart, and HTTP surface
        run: bash tests/run_fresh_postgres_proxy_migrations.sh streamvault:test

  # ──────────────────────────────────────────────
  # Quick Security Scan (inline, for fast feedback)
  # ──────────────────────────────────────────────
  security-scan:
    name: Quick Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-db:2'
          TRIVY_JAVA_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-java-db:1'
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-filesystem'
        continue-on-error: true

      - name: Python dependency security check
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

          echo "🔍 Running dependency audit..."
          pip-audit -r requirements.txt

          echo "🔍 Running bandit static analysis..."
          bandit -r app/ -ll -iii --exclude app/__pycache__,app/frontend

      - name: Node dependency audit
        working-directory: app/frontend
        run: |
          bash ../../scripts/ci/npm-audit-with-retry.sh
