name: Security Scanning (SAST/DAST)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly scan every Monday at 06:00 UTC
    - cron: '0 6 * * 1'

# Prevent concurrent scans on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # ──────────────────────────────────────────────
  # Python SAST — Bandit
  # ──────────────────────────────────────────────
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit scan
        run: |
          bandit -r app/ \
            -f json \
            -o bandit-results.json \
            --severity-level high \
            --confidence-level high \
            -x 'app/__pycache__,app/frontend'

      - name: Display results
        if: always()
        run: |
          if [ -f bandit-results.json ]; then
            python -m json.tool bandit-results.json
          fi

      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bandit-results
          path: bandit-results.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # Python dependency audit — pip-audit
  # ──────────────────────────────────────────────
  pip-audit:
    name: pip-audit (Python Dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit \
            -r requirements.txt \
            --format json \
            --output pip-audit-results.json

      - name: Display results
        if: always()
        run: |
          if [ -f pip-audit-results.json ]; then
            python -m json.tool pip-audit-results.json
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # JavaScript dependency audit — npm audit
  # ──────────────────────────────────────────────
  npm-audit:
    name: npm audit (JS Dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci --prefer-offline

      - name: Run npm audit
        working-directory: app/frontend
        run: |
          npm audit --audit-level high --json > npm-audit-results.json

      - name: Display results
        if: always()
        working-directory: app/frontend
        run: |
          if [ -f npm-audit-results.json ]; then
            cat npm-audit-results.json | head -100
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-audit-results
          path: app/frontend/npm-audit-results.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # Container image scanning — Trivy
  # ──────────────────────────────────────────────
  trivy:
    name: Trivy (Container Scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'app/frontend/package-lock.json'

      - name: Cache frontend build
        id: frontend-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            app/frontend/dist
            app/frontend/node_modules
          key: frontend-build-${{ hashFiles('app/frontend/package-lock.json', 'app/frontend/src/**') }}
          restore-keys: |
            frontend-build-

      - name: Build Frontend
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        working-directory: app/frontend
        run: |
          npm ci
          rm -rf dist || true
          npm run build

      - name: Build Docker image for scanning
        id: docker-build
        run: docker build -f docker/Dockerfile -t streamvault:scan .

      - name: Run Trivy vulnerability scanner (SARIF)
        if: steps.docker-build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-db:2'
          TRIVY_JAVA_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-java-db:1'
        with:
          image-ref: 'streamvault:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy SARIF to GitHub Security
        if: always() && steps.docker-build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container'
        continue-on-error: true

      - name: Run Trivy (table output for logs)
        if: steps.docker-build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-db:2'
          TRIVY_JAVA_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-java-db:1'
        with:
          image-ref: 'streamvault:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Clean up
        if: always()
        run: docker rmi streamvault:scan 2>/dev/null || true

  # ──────────────────────────────────────────────
  # Dockerfile linting — Hadolint
  # ──────────────────────────────────────────────
  hadolint:
    name: Hadolint (Dockerfile Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/Dockerfile
          format: sarif
          output-file: hadolint-results.sarif
          failure-threshold: error

      - name: Upload Hadolint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: hadolint-results.sarif
          category: 'hadolint'
        continue-on-error: true

  # ──────────────────────────────────────────────
  # Secret scanning — Gitleaks
  # ──────────────────────────────────────────────
  gitleaks:
    name: Gitleaks (Secret Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
